name: Build and Deploy

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check deployment access
        timeout-minutes: 1
        env:
          DEPLOY_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: bash .github/scripts/check-deploy-access.sh

      - name: Setup PHP 🔧
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: mbstring, xml
          coverage: none
          tools: composer:v2

      - name: Install and Build 🔧
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-suggest --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Generate
        env:
          APP_NAME: Orchid
          APP_ENV: production
          APP_KEY: base64:8Jv9H6OMWkWui9VzMwjSiLPfMqRnZGN0PNVUmMc5Dyc=
          APP_DEBUG: false
          APP_URL: https://orchid.software
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          php artisan export
          php artisan make:sitemap

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: gh-pages
          folder: storage/app/public
